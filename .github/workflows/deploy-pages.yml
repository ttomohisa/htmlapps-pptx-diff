name: Deploy standalone app to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      pages-ready: ${{ steps.pages-status.outputs.ready }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate PowerShell syntax and encoding
        shell: powershell
        run: .\scripts\check-powershell-syntax.ps1

      - name: Build and verify standalone HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Check whether GitHub Pages is enabled
        id: pages-status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$env:GITHUB_REPOSITORY/pages" --silent 2>$null

          if ($LASTEXITCODE -eq 0) {
            "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "GitHub Pages is enabled. The deployment will continue."
            exit 0
          }

          "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          @"
          ## GitHub Pages is not enabled yet

          The standalone HTML was built successfully, but deployment was skipped.

          1. Open **Settings → Pages** in this repository.
          2. Under **Build and deployment**, set **Source** to **GitHub Actions**.
          3. Open **Actions**, select this workflow, and choose **Re-run all jobs**.

          This one-time repository setting cannot be enabled with the default `GITHUB_TOKEN`.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          Write-Warning "GitHub Pages is not enabled. Deployment is skipped; see the workflow summary for setup steps."
          exit 0

      - name: Configure GitHub Pages
        if: steps.pages-status.outputs.ready == 'true'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: steps.pages-status.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Upload standalone build artifact
        uses: actions/upload-artifact@v7
        with:
          name: standalone-html-${{ github.sha }}
          path: |
            dist/index.html
            dist/index.self-extract.html
            dist/dependency-manifest.json
            dist/self-extract-manifest.json
            dist/.nojekyll
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: needs.build.outputs.pages-ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Publish versioned tag and GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pptx-diff-release-main
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      actions: read
    steps:
      - name: Check out the exact merged commit
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Check merge, version, and existing release
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("app.config.json", encoding="utf-8"))["version"])')"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::app.config.json must contain a stable Semantic Version."
            exit 1
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Only publish when the push is an actual merged PR to main.
          MERGED_PR=""
          for attempt in 1 2 3 4; do
            MERGED_PR="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "main") | .number][0] // ""')"
            if [[ -n "$MERGED_PR" ]]; then break; fi
            if [[ "$attempt" -lt 4 ]]; then sleep 4; fi
          done
          if [[ -z "$MERGED_PR" ]]; then
            echo "No merged PR belongs to this commit; no release is needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Never move or overwrite a tag that was published from another commit.
          TAG_SHA="$(git ls-remote --tags origin "refs/tags/$TAG^{}" | cut -f1)"
          if [[ -z "$TAG_SHA" ]]; then
            TAG_SHA="$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)"
          fi
          if [[ -n "$TAG_SHA" && "$TAG_SHA" != "$GITHUB_SHA" ]]; then
            echo "::notice::Existing $TAG points to a different commit ($TAG_SHA). Bump the app version for a new release."
            echo "Skipped $TAG: the tag belongs to another commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Recover an interrupted draft publication, but never edit a published release.
          EXISTING_DRAFT="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ "$EXISTING_DRAFT" == "false" ]]; then
            echo "Release $TAG already exists; no duplicate will be published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$EXISTING_DRAFT" == "true" ]]; then
            echo "recover_draft=true" >> "$GITHUB_OUTPUT"
            echo "Resuming interrupted $TAG draft publication." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Merged PR #$MERGED_PR will publish $TAG from $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"

      - name: Download the previously validated HTML build
        if: steps.gate.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: standalone-html-${{ github.sha }}
          path: dist

      - name: Assemble GitHub Release downloads
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package-release.py --output release-assets --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          (cd release-assets && sha256sum --check SHA256SUMS.txt)

      - name: Create tag and publish release
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.gate.outputs.version }}
          TAG: ${{ steps.gate.outputs.tag }}
          RECOVER_DRAFT: ${{ steps.gate.outputs.recover_draft }}
        run: |
          set -euo pipefail
          PREFIX="htmlapps-pptx-diff-v$VERSION"
          if [[ "$RECOVER_DRAFT" == "true" ]]; then
            gh release upload "$TAG" \
              "release-assets/$PREFIX.html" \
              "release-assets/$PREFIX.self-extract.html" \
              "release-assets/$PREFIX.zip" \
              "release-assets/SHA256SUMS.txt" --clobber
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "PPTX Diff $TAG" \
              --notes-file release-assets/release-notes.md \
              --draft=false
          else
            gh release create "$TAG" \
              "release-assets/$PREFIX.html" \
              "release-assets/$PREFIX.self-extract.html" \
              "release-assets/$PREFIX.zip" \
              "release-assets/SHA256SUMS.txt" \
              --target "$GITHUB_SHA" \
              --title "PPTX Diff $TAG" \
              --notes-file release-assets/release-notes.md
          fi
          echo "Published $TAG from the validated $GITHUB_SHA build." >> "$GITHUB_STEP_SUMMARY"

