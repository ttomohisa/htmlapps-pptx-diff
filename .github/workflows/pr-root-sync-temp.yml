name: Temporary PR root standalone sync
on:
  push:
    branches:
      - fix/pptx-diff-semantic-audit-20261122
permissions:
  contents: write
jobs:
  sync-root:
    if: github.repository == 'ttomohisa/htmlapps-pptx-diff' && github.ref == 'refs/heads/fix/pptx-diff-semantic-audit-20261122'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Build and validate standalone files
        shell: pwsh
        run: ./scripts/check-repository.ps1
      - name: Synchronize root HTML
        shell: bash
        run: |
          set -euo pipefail
          git add -- pptx-diff.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: synchronize visual-first layout"
          git push origin HEAD:refs/heads/fix/pptx-diff-semantic-audit-20261122
